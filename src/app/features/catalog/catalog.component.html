<section class="page-hero">
  <p class="eyebrow">{{ eyebrow() }}</p>
  <h1>{{ title() }}</h1>
  @if (description()) {
    <p class="lede">{{ description() }}</p>
  }
</section>

<section class="catalog container">
  <button class="btn btn-ghost filter-toggle" type="button" (click)="mobileFilters.set(!mobileFilters())">
    {{ mobileFilters() ? 'Hide filters' : 'Show filters' }}
  </button>

  <div class="layout" [class.open]="mobileFilters()">
    <app-product-filters [facets]="facets()" [query]="query()" (queryChange)="onFilter($event)" />
    <div>
      <div class="toolbar">
        <p class="count">{{ total() }} {{ total() === 1 ? 'piece' : 'pieces' }}</p>
        <div class="tools">
          <label class="sort">
            <span>Sort</span>
            <p-select
              [options]="sortOptions"
              optionLabel="label"
              optionValue="value"
              [ngModel]="query().sort || 'newest'"
              (ngModelChange)="onSort($event)"
              appendTo="body"
              styleClass="catalog-sort" />
          </label>
          <div class="cols" aria-label="Grid density">
            @for (opt of densityOptions; track opt.cols) {
              <button
                type="button"
                [class.on]="columns() === opt.cols"
                (click)="columns.set(opt.cols)"
                [attr.aria-label]="opt.label"
                [attr.aria-pressed]="columns() === opt.cols">
                <app-icon [name]="opt.icon" [size]="16" [strokeWidth]="1.75" />
              </button>
            }
          </div>
        </div>
      </div>

      @if (loading()) {
        <app-loading-skeleton />
      } @else if (!products().length) {
        <app-empty-state title="No pieces matched these filters." message="Clear filters or try another category. The floor collection changes often." />
      } @else {
        <div [class]="'grid-products cols-' + columns()">
          @for (product of products(); track product.id) {
            <app-product-card [product]="product" />
          }
        </div>
        <p-paginator
          [rows]="query().pageSize || 12"
          [totalRecords]="total()"
          [first]="((query().page || 1) - 1) * (query().pageSize || 12)"
          [showCurrentPageReport]="total() > 12"
          currentPageReportTemplate="{first}–{last} of {totalRecords}"
          (onPageChange)="onPage($event)" />
      }
    </div>
  </div>
</section>
