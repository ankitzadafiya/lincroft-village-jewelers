<app-hero-triptych [categories]="heroCategories()" />

<app-category-mosaic [categories]="heroCategories()" />

<!-- Best sellers + New arrivals: four admin-chosen pieces each (product flags) -->
<div class="collections band-tint">
  @if (bestLoading() || bestSellers().length) {
    <app-home-collection
      key="best"
      kicker="Trending"
      title="Best sellers"
      subtitle="Pieces customers love right now, priced in USD."
      [products]="bestSellers()"
      [loading]="bestLoading()"
      viewAllLink="/best-sellers" />
  }
  @if (arrivalsLoading() || arrivals().length) {
    <app-home-collection
      key="new"
      kicker="Just in"
      title="New arrivals"
      subtitle="The latest pieces to arrive in the Lincroft showroom."
      [products]="arrivals()"
      [loading]="arrivalsLoading()"
      viewAllLink="/new-arrivals" />
  }
</div>

<!-- Video features (demo Pexels clips until the store's own videos arrive) -->
<app-shop-the-look
  key="bridal"
  kicker="Lab-grown bridal"
  title="Made to be worn"
  lede="Engagement rings and wedding bands in lab-grown diamonds. See them in real light, then try them on in Lincroft."
  allLink="/ring"
  allLabel="Explore all rings"
  [tiles]="bridalTiles" />

<app-shop-the-look
  key="everyday"
  kicker="Everyday & gold"
  title="Shine every day"
  lede="Easy pieces for every day, and silver finished in 24k gold plating. Made to layer, stack and wear."
  allLink="/shop"
  allLabel="Explore all jewelry"
  [reverse]="true"
  [tiles]="everydayTiles" />

<section class="occasions band-tint" aria-labelledby="occ-title">
  <div class="container">
    <header class="occ-head" appReveal="fade">
      <p class="occ-kicker">Shop for occasions</p>
      <h2 id="occ-title">Jewelry for every moment, every day</h2>
    </header>
    <div class="occ-grid" appReveal="up" [appRevealStagger]="true">
      @for (item of occasionPicks; track item.subcategory) {
        <a class="occ-card" [routerLink]="item.route" [queryParams]="{ subcategory: item.subcategory }">
          <div class="occ-media">
            <img
              [src]="item.image"
              [alt]="item.alt"
              loading="lazy"
              decoding="async"
              [style.object-position]="item.imagePosition" />
            <span class="occ-frame" aria-hidden="true"></span>
          </div>
          <div class="occ-overlay">
            <span class="occ-hint">{{ item.hint }}</span>
            <h3>{{ item.label }}</h3>
            <span class="occ-cta">
              <span>Shop now</span>
              <app-icon name="arrow-right" [size]="14" [strokeWidth]="1.6"></app-icon>
            </span>
          </div>
        </a>
      }
    </div>
  </div>
</section>
