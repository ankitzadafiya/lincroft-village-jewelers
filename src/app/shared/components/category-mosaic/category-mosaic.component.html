<section class="cats" aria-labelledby="cats-title">
  <header class="head container">
    <h2 id="cats-title">{{ titleAccent() }} {{ title() }}</h2>
    @if (subtitle()) {
      <p>{{ subtitle() }}</p>
    }
  </header>

  @if (hasCards()) {
    <div class="mosaic">
      @for (card of cards(); track card.id) {
        <a class="tile" [class]="'tile area-' + card.area" [routerLink]="'/' + card.slug">
          <span class="media" [class.contain]="card.contain">
            @if (card.image) {
              <img [src]="card.image" [alt]="card.alt" loading="lazy" decoding="async" draggable="false" />
            }
          </span>
          <span class="shade" aria-hidden="true"></span>
          <span class="sheen" aria-hidden="true"></span>
          <span class="frame" aria-hidden="true"></span>

          <span class="cap">
            <span class="cap-text">
              <span class="idx" aria-hidden="true">{{ card.index }}</span>
              <span class="label">{{ card.label }}</span>
              @if (showCount()) {
                <span class="meta">{{ card.meta }}</span>
              }
              <span class="shop" aria-hidden="true">Shop now</span>
            </span>
            <span class="go" aria-hidden="true">
              <app-icon name="arrow-up-right" [size]="12" [strokeWidth]="1.7"></app-icon>
            </span>
          </span>
        </a>
      }
    </div>
  } @else {
    <div class="mosaic is-loading" aria-hidden="true">
      <span class="ghost area-a"></span>
      <span class="ghost area-b"></span>
      <span class="ghost area-m"></span>
      <span class="ghost area-c"></span>
      <span class="ghost area-d"></span>
    </div>
  }
</section>
